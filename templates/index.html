<html>
<head>
    <title>Contact</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <div class="header">
        <h2>Contact List</h2>
        <a href="/add" class="add-bt"> Add Contact</a>
    </div>
    <div class="table-wrap">
        <table class="table">
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Action</th>
            </tr>
            {% for contact in contacts %}
            <tr>
                <td>{{contact["first_name"]}}</td>
                <td>{{contact["last_name"]}}</td>
                <td>{{contact["email"]}}</td>
                <td>{{contact["phone"]}}</td>
                <td>{{contact["address"]}}</td>
                <td>
                    <a href="/edit/{{contact['id']}}" class="edit-bt">Edit</a>
                    <a href="/delete/{{contact['id']}}" class="delete-bt">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
