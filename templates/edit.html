<html>
<head>
    <title>Edit Contact</title>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <div class="form-container">
        <div class="form-card">
            <div class="form-header">
                <h2>Edit Contact</h2>
            </div>
            <div class="form-body">
                <form method="POST" action="/edit/{{contact['id']}}">
                    <div class="row2">
                        <div class="field">
                            <label>First Name</label>
                            <input type="text" name="first_name" value="{{contact['first_name']}}" required>
                        </div>
                        <div class="field">
                            <label>Last Name</label>
                            <input type="text" name="last_name" value="{{contact['last_name']}}" required>
                        </div>
                    </div>
                    <div class="field">
                        <label>Email</label>
                        <input type="email" name="email" value="{{contact['email']}}" required>
                    </div>
                    <div class="field">
                        <label>Phone Number</label>
                        <input type="text" name="phone" value="{{contact['phone']}}" required>
                    </div>
                    <div class="field">
                        <label>Address</label>
                        <input type="text" name="address" value="{{contact['address']}}">
                    </div>
                    <button type="submit" class="submit-bt">Update Contact</button>
                </form>
            </div>
        </div>
        <a href="/" class="back-link">Back to Contact List</a>
    </div>
</body>
</html>
